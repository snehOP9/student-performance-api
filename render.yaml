services:
  - type: web
    name: student-performance-api
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn api.main:app --host 0.0.0.0 --port $PORT
    autoDeploy: true

  - type: web
    name: sri-center-ui
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: streamlit run app/main.py --server.address 0.0.0.0 --server.port $PORT
    autoDeploy: true
    envVars:
      - key: API_BASE
        value: https://student-performance-api.onrender.com
