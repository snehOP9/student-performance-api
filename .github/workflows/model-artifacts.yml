name: Model artifact compatibility

on:
  pull_request:
    paths:
      - 'requirements.txt'
      - 'artifacts/**'
      - 'scripts/check_model_artifacts.py'
      - '.github/workflows/model-artifacts.yml'
  push:
    branches:
      - main
    paths:
      - 'requirements.txt'
      - 'artifacts/**'
      - 'scripts/check_model_artifacts.py'
      - '.github/workflows/model-artifacts.yml'

permissions:
  contents: read

jobs:
  artifact-smoke-test:
    name: Load model and run inference
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install model runtime dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Validate committed model artifacts
        run: python scripts/check_model_artifacts.py
