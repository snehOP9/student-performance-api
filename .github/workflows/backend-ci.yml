name: Backend CI

on:
  push:
    branches: [main]
    paths:
      - "api/**"
      - "tests/**"
      - "requirements.txt"
      - ".github/workflows/backend-ci.yml"
  pull_request:
    branches: [main]
    paths:
      - "api/**"
      - "tests/**"
      - "requirements.txt"
      - ".github/workflows/backend-ci.yml"

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: api/requirements.txt

      - name: Install backend dependencies
        run: python -m pip install --disable-pip-version-check -r api/requirements.txt

      - name: Compile backend modules
        run: python -m compileall -q api

      - name: Run backend regression tests
        env:
          JWT_SECRET_KEY: ci-only-secret-key-that-is-longer-than-32-characters
        run: python -m unittest discover -s tests -p "test_*.py" -v
