name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: api/requirements.txt
      - run: python -m pip install --disable-pip-version-check -r api/requirements.txt
      - run: python -m compileall -q api
      - name: Run backend regression tests
        env:
          JWT_SECRET_KEY: ci-only-secret-key-that-is-longer-than-32-characters
        run: python -m unittest discover -s tests -p "test_*.py" -v

  frontend:
    name: Frontend lint and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: student-performance-predictor-pro
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: student-performance-predictor-pro/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
